name: Dependency remediation preview

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/dependency-remediation-preview.yml"

permissions:
  contents: write

concurrency:
  group: dependency-remediation-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview safe dependency fixes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the actual pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve the updated dependency manifest
        run: bun install

      # Bun's non-major audit fixer chooses the lowest patched versions allowed
      # by current dependency ranges. Changes stay in the isolated runner until
      # the audit, typecheck, tests, lint and build have all passed.
      - name: Apply non-major security fixes in the isolated runner
        id: audit_fix
        continue-on-error: true
        run: bun audit fix

      - name: Verify the updated dependency graph
        id: audit
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Typecheck
        run: bun run typecheck

      - name: Automated tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'placeholder' }}

      - name: Upload dependency update candidate for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniport-dependency-remediation-candidate
          path: |
            package.json
            bun.lock
          if-no-files-found: error
          retention-days: 3

      - name: Require a clean security audit
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "::error::The dependency update candidate still has unresolved high or critical advisories."
            exit 1
          fi

      # This workflow is intentionally limited to this same-repository review
      # branch. It pushes only the lockfile produced by the successful audit
      # and test run; it never targets main or a fork.
      - name: Commit verified dependency lockfile to the review branch
        if: success() && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/miniport-ci-quality-fixes-2026-11-01'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(security): update patched dependencies"
          git push origin "HEAD:${PR_HEAD_REF}"
