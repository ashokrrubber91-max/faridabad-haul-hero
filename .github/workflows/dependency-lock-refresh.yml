name: Refresh security dependency lockfile

on:
  push:
    branches:
      - security/patch-transitive-dependencies

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/patch-transitive-dependencies
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Resolve the explicit patched overrides and refresh only the existing Bun lockfile.
      - name: Resolve patched dependency tree
        run: bun install

      - name: Commit refreshed lockfile to this review branch
        run: |
          if ! git diff --quiet -- package.json bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json bun.lock
            git commit -m "chore: refresh dependency lockfile for security patches"
            git push origin HEAD:security/patch-transitive-dependencies
          else
            echo "Dependency lockfile already matches the patched package constraints."
          fi
